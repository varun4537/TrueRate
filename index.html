<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueRate: Product Comparison</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#E75A7C',   // Pinkish Red
                secondary: '#BBC7A4', // Sage Green
                accent: '#2C363F',    // Dark Blue/Grey
                surface: '#F8FAFC',
              },
              neutral: {
                900: '#0F172A',
                700: '#334155',
                500: '#64748B',
                400: '#94A3B8',
                300: '#CBD5E1',
                200: '#E2E8F0',
                100: '#F1F5F9',
                0: '#FFFFFF',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            borderRadius: {
              'xl': '16px',
              '2xl': '24px',
              '3xl': '32px',
            },
            boxShadow: {
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
              'glass': '0 4px 30px rgba(0, 0, 0, 0.1)',
              'floating': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-spinner::-webkit-outer-spin-button,
      .no-spinner::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Hide scrollbar for Firefox */
      .no-spinner {
        -moz-appearance: textfield;
      }
      
      /* Refined Glassmorphism */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      
      .glass-input {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(226, 232, 240, 0.8);
        transition: all 0.2s ease;
      }
      
      .glass-input:focus {
        background: rgba(255, 255, 255, 0.95);
        border-color: #E75A7C;
        box-shadow: 0 0 0 2px rgba(231, 90, 124, 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-[#F8FAFC] text-neutral-900 font-sans antialiased min-h-screen selection:bg-brand-primary selection:text-white overflow-x-hidden">
    <!-- Subtle Gradient Mesh Background -->
    <div class="fixed inset-0 -z-10 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-[#FFE5EC]/40 via-[#F1F5F9] to-[#E2E8F0]/50"></div>
    <div id="root"></div>
  </body>
</html>
