    <title>TrueRate: Product Comparison</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#E75A7C',   // Pinkish Red
                secondary: '#BBC7A4', // Sage Green
                accent: '#2C363F',    // Dark Blue/Grey
              },
              neutral: {
                900: '#2C363F',
                700: '#5F6770',
                500: '#9AA0A6',
                300: '#D6DBD2',
                100: '#F2F5EA',
                0: '#FFFFFF',
              },
              state: {
                success: '#BBC7A4',
                warning: '#F2C94C',
                error: '#E75A7C',
                info: '#6B9AC4',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            borderRadius: {
              'xl': '20px',    // lg from design.json
              '2xl': '32px',   // xl from design.json
            },
            boxShadow: {
              'card': '0 1px 2px rgba(44, 54, 63, 0.06)', // sm
              'floating': '0 12px 32px rgba(44, 54, 63, 0.12)', // lg
            }
          }
        }
      }

    <style>
